<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operational Constraint Diagnostic | Pivot Prime</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --dark:#013325; --mid:#009f50; --neon:#00d76d; --gold:#af8943;
  --teal:#1f7f95; --cream:#fefbf8; --ink:#0d1f19; --muted:#5f6f69;
  --line:#dfe6e2; --panel:#f4f8f5;
  --head:'Poppins',system-ui,sans-serif;
  --body:Calibri,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding:0 24px 96px}

/* header */
header{background:var(--dark);color:#fff;padding:18px 0;margin-bottom:36px}
header .wrap{padding-bottom:0;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
.brand span{color:var(--neon)}
.stepnote{font-size:13px;color:#9fc4b4;letter-spacing:.06em;text-transform:uppercase}

h1{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.18;margin:0 0 14px;color:var(--dark)}
h2{font-family:var(--head);font-weight:600;font-size:24px;line-height:1.25;margin:0 0 6px;color:var(--dark)}
h3{font-family:var(--head);font-weight:600;font-size:17px;margin:0 0 10px;color:var(--dark)}
p{margin:0 0 14px;max-width:62ch}
.lead{font-size:19px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* progress */
.progress{display:flex;gap:6px;margin:0 0 28px}
.progress i{height:4px;flex:1;background:var(--line);border-radius:2px}
.progress i.done{background:var(--mid)}
.progress i.now{background:var(--neon)}

/* form bits */
label.field{display:block;margin:0 0 20px;max-width:460px}
label.field span{display:block;font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--mid);margin-bottom:6px}
input[type=text],select,textarea{
  width:100%;font-family:var(--body);font-size:17px;color:var(--ink);
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:11px 13px}
textarea{min-height:110px;resize:vertical;max-width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:3px solid var(--neon);outline-offset:2px}

/* questions */
.q{border-top:1px solid var(--line);padding:22px 0}
.q:first-of-type{border-top:none}
.qtext{display:flex;gap:14px;margin-bottom:14px}
.qnum{font-family:var(--head);font-weight:600;font-size:13px;color:var(--gold);padding-top:4px;min-width:26px}
.qbody{font-size:17px;max-width:60ch}
.scale{display:flex;flex-wrap:wrap;gap:8px;padding-left:40px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;width:0;height:0}
.opt span{
  display:block;cursor:pointer;font-size:14px;padding:8px 13px;border:1px solid var(--line);
  border-radius:999px;background:#fff;user-select:none;transition:background .12s,border-color .12s,color .12s}
.opt input:checked + span{background:var(--dark);border-color:var(--dark);color:#fff}
.opt.na input:checked + span{background:var(--muted);border-color:var(--muted)}

/* nav */
.nav{display:flex;gap:12px;align-items:center;margin-top:34px;flex-wrap:wrap}
button{font-family:var(--head);font-weight:600;font-size:15px;border:none;border-radius:999px;padding:13px 26px;cursor:pointer}
.btn{background:var(--mid);color:#fff}
.btn:hover{background:var(--dark)}
.btn.ghost{background:transparent;color:var(--dark);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--dark)}
button:disabled{opacity:.4;cursor:not-allowed}
.warn{font-size:14px;color:var(--gold)}

/* results */
.headline{background:var(--dark);color:#fff;border-radius:10px;padding:32px 34px;margin:0 0 32px}
.headline .score{font-family:var(--head);font-weight:700;font-size:76px;line-height:1;color:var(--neon)}
.headline .band{font-family:var(--head);font-weight:600;font-size:22px;margin:10px 0 8px}
.headline p{color:#cfe3da;margin:0;max-width:56ch}

.bars{margin:0 0 12px}
.bar{margin:0 0 16px}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:5px}
.bar .name{font-family:var(--head);font-weight:600;font-size:15px}
.bar .val{font-family:var(--head);font-weight:600;font-size:15px;color:var(--mid)}
.bar .track{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar .fill{height:100%;background:var(--mid);border-radius:5px}
.bar.nodata .val{color:var(--muted);font-weight:400;font-size:13px}

/* constraint ranking: the signature element */
.rank{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.rank .row{display:grid;grid-template-columns:34px 1fr 96px;gap:14px;align-items:center;padding:15px 18px;border-top:1px solid var(--line)}
.rank .row:first-child{border-top:none}
.rank .row.primary{background:var(--panel)}
.rank .pos{font-family:var(--head);font-weight:700;font-size:15px;color:var(--gold)}
.rank .row.primary .pos{color:var(--dark)}
.rank .nm{font-family:var(--head);font-weight:600;font-size:15px}
.rank .sub{font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.rank .def{text-align:right}
.rank .defbar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.rank .defbar i{display:block;height:100%;background:var(--gold);border-radius:3px}
.rank .defnum{font-family:var(--head);font-weight:600;font-size:15px;color:var(--gold)}

.callout{border-left:4px solid var(--mid);background:var(--panel);padding:18px 22px;border-radius:0 8px 8px 0;margin:0 0 26px}
.callout p:last-child{margin-bottom:0}
.divider{border:none;border-top:1px solid var(--line);margin:38px 0}
.ft{border-top:1px solid var(--line);padding-top:16px;margin-top:10px}
.ft dt{font-family:var(--head);font-weight:600;font-size:14px;color:var(--mid);margin-bottom:4px}
.ft dd{margin:0 0 16px;white-space:pre-wrap}
.hide{display:none}

@media (max-width:640px){
  h1{font-size:27px}
  .headline{padding:24px 22px}
  .headline .score{font-size:58px}
  .scale{padding-left:0}
  .rank .row{grid-template-columns:26px 1fr 76px;gap:10px;padding:13px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  header,.nav,.noprint{display:none!important}
  body{background:#fff;font-size:12pt}
  .headline{background:#fff;color:var(--ink);border:2px solid var(--dark)}
  .headline .score{color:var(--dark)}
  .headline p{color:var(--muted)}
  .wrap{max-width:none;padding:0}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="brand">Pivot<span>Prime</span></div>
    <div class="stepnote" id="stepnote">Operational Constraint Diagnostic</div>
  </div>
</header>

<div class="wrap">
  <div class="progress" id="progress"></div>
  <div id="screen"></div>
</div>

<script>
"use strict";

/* ---------------- data ---------------- */

const DOMAINS = [
  { id:"founder", name:"Founder dependency",
    blurb:"How much of the business routes through one person, and what stops if they step away.",
    points:"Fractional Leadership" },
  { id:"process", name:"Process and delivery",
    blurb:"Whether work flows predictably, is documented, and finishes without chasing.",
    points:"Fractional Leadership, Build and Place" },
  { id:"commercial", name:"Commercial and margin",
    blurb:"Whether pricing is deliberate, margin is known by unit, and cash is collected.",
    points:"Operational Clarity Audit, CFO seat" },
  { id:"data", name:"Data and visibility",
    blurb:"Whether leaders decide on numbers or instinct, and whether the numbers are trusted.",
    points:"Technology Builds" },
  { id:"people", name:"People and accountability",
    blurb:"Whether roles, ownership and decision rights are clear, and whether capacity exists.",
    points:"Fractional Leadership, Build and Place" },
  { id:"tech", name:"Technology leverage",
    blurb:"Whether systems reduce manual work or add to it.",
    points:"Technology Builds" }
];

const Q = {
  founder:[
    "If the founder were uncontactable for two weeks, the business would continue without disruption.",
    "Decisions below a defined value are made without needing the founder to approve them.",
    "Client relationships are held by the business rather than by one person.",
    "The founder spends most of their time on work that only they can do.",
    "There is at least one person who could run day to day operations if the founder stepped back.",
    "The founder has taken two or more consecutive weeks of leave in the last year without checking in daily.",
    "Significant commercial and operational decisions have a named owner other than the founder."
  ],
  process:[
    "Our core processes are documented well enough that a new person could follow them.",
    "Work is delivered on time without someone having to chase it.",
    "What sales commits to is consistently what delivery can actually deliver.",
    "Work continues to run normally when a key person is on leave.",
    "Quality holds when volume increases.",
    "Work rarely has to be redone or corrected after it has been completed.",
    "A new hire becomes productive within a defined onboarding period rather than by absorbing it slowly."
  ],
  commercial:[
    "We know our profit margin by product, service or client, not just overall.",
    "Our prices were set deliberately and have been reviewed in the last twelve months.",
    "We know whether a job or contract is making money while it is running, not months afterwards.",
    "Discounting is exceptional rather than routine.",
    "Cash is collected on the agreed terms without significant chasing.",
    "No single client represents more than a quarter of revenue.",
    "Profit has grown at least as fast as revenue over the last two years."
  ],
  data:[
    "I can see how the business is performing this month without asking someone to prepare it.",
    "When two people report the same number, they agree.",
    "We have a small set of KPIs that leadership genuinely uses to make decisions.",
    "We find out about problems from our own data before customers tell us.",
    "Our forecasts have been reasonably accurate over the last three periods.",
    "Reporting is produced automatically rather than assembled by hand each time.",
    "We could answer a detailed board or investor question about performance within a day."
  ],
  people:[
    "Every important outcome in the business has one clearly named owner.",
    "The team has the capacity to absorb the growth we are planning.",
    "Roles were designed around the work the business needs, not around the people who were available.",
    "If you asked three leaders for the top three priorities, you would get the same answers.",
    "Initiatives that are not working get stopped rather than quietly continuing.",
    "People who leave go for opportunity rather than frustration.",
    "Performance conversations happen on a defined rhythm rather than when something goes wrong."
  ],
  tech:[
    "Our systems reduce manual work rather than creating more of it.",
    "Information moves between our tools without anyone re-entering it.",
    "Nobody in the business spends significant time copying data between systems.",
    "We actively use the software we pay for.",
    "Our CRM reflects what is genuinely happening in sales and delivery.",
    "Technology decisions are made against a defined problem rather than a feature we liked.",
    "We could describe our core process precisely enough for someone to automate it."
  ]
};

/* anchors shared with the 4-minute website version: first two of each domain */
const ANCHORS = new Set(["founder-0","founder-1","process-0","process-1","commercial-0","commercial-1",
  "data-0","data-1","people-0","people-1","tech-0","tech-1"]);

const WEIGHTS = {
  founderled:{ label:"Founder-led, under 20 staff", founder:25, process:20, commercial:20, data:10, people:15, tech:10 },
  sme:{ label:"Scaling SME, 20 to 100 staff",       founder:15, process:20, commercial:25, data:15, people:15, tech:10 },
  midmarket:{ label:"Mid-market, 100+ staff",        founder:5,  process:25, commercial:20, data:20, people:20, tech:10 }
};

const SCALE = [
  {v:4, t:"Strongly agree"},
  {v:3, t:"Agree"},
  {v:2, t:"Neither"},
  {v:1, t:"Disagree"},
  {v:0, t:"Strongly disagree"},
  {v:1, t:"Do not know", dk:true},
  {v:null, t:"Not applicable", na:true}
];

const FREETEXT = [
  "What have you already tried to fix, and what happened?",
  "What do you believe is actually holding the business back?",
  "What single change would make the biggest difference in the next six months?",
  "What is coming in the next twelve months that the business is not ready for?"
];

const BANDS = [
  {min:85, name:"Built to scale", line:"Structurally sound. The constraint is more likely to be demand than operations."},
  {min:65, name:"Stable",         line:"The foundations hold. One area is limiting what the rest could do."},
  {min:40, name:"Straining",      line:"The business works, but it is absorbing effort it should not need to."},
  {min:0,  name:"Constrained",    line:"The business is being held back in more than one place at once. Sequencing matters more than effort."}
];

/* ---------------- state ---------------- */

const state = {
  step:0,                       // 0 setup, 1..6 domains, 7 free text, 8 results
  meta:{ business:"", respondent:"", role:"leadership", preset:"sme" },
  answers:{},                   // "domain-index" -> {v:number|null, na:bool, dk:bool}
  text:["","","",""]
};

const TOTAL_STEPS = 8;
const $ = id => document.getElementById(id);

/* ---------------- scoring ---------------- */

function domainResult(d){
  let sum = 0, n = 0;
  Q[d.id].forEach((_,i)=>{
    const a = state.answers[d.id+"-"+i];
    if(!a || a.na) return;
    sum += a.v; n++;
  });
  if(n < 4) return { id:d.id, name:d.name, scored:n, insufficient:true };
  return { id:d.id, name:d.name, scored:n, insufficient:false, score: Math.round((sum/(4*n))*100) };
}

function compute(){
  const w = WEIGHTS[state.meta.preset];
  const rows = DOMAINS.map(domainResult);
  const usable = rows.filter(r=>!r.insufficient);

  // redistribute weight proportionally across domains that produced a score
  const wSum = usable.reduce((t,r)=>t + w[r.id], 0);
  usable.forEach(r=>{ r.weight = wSum ? (w[r.id]/wSum)*100 : 0; });

  const overall = wSum
    ? Math.round(usable.reduce((t,r)=>t + r.score*r.weight, 0)/100)
    : null;

  usable.forEach(r=>{ r.deficit = +(r.weight*(100-r.score)/100).toFixed(1); });
  const ranked = [...usable].sort((a,b)=>b.deficit-a.deficit);

  // joint where deficits sit within 3 points of the leader
  ranked.forEach((r,i)=>{ r.joint = i>0 && Math.abs(ranked[0].deficit - r.deficit) <= 3 && i === 1; });

  const band = overall===null ? null : BANDS.find(b=>overall >= b.min);
  return { rows, ranked, overall, band, weightsLabel:w.label };
}

/* ---------------- rendering ---------------- */

function renderProgress(){
  const el = $("progress");
  el.innerHTML = "";
  for(let i=0;i<TOTAL_STEPS;i++){
    const s = document.createElement("i");
    if(state.step > i+0 && i < state.step) s.className = i < state.step-0 ? "done" : "";
    if(i === state.step-1) s.className = "now";
    else if(i < state.step-1) s.className = "done";
    el.appendChild(s);
  }
  el.style.visibility = state.step===0 ? "hidden" : "visible";
}

function setNote(t){ $("stepnote").textContent = t; }

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }

function screenSetup(){
  setNote("Operational Constraint Diagnostic");
  return `
    <h1>The Operational Constraint Diagnostic</h1>
    <p class="lead">Forty-two statements across six areas of the business. It takes about twenty minutes, and it produces a ranked view of what is actually limiting growth.</p>
    <div class="callout">
      <p><strong>Answer as things are, not as they should be.</strong> The instrument is only useful if it is answered honestly, and individual answers are not shown to anyone else in your business.</p>
    </div>
    <label class="field"><span>Business name</span>
      <input type="text" id="f-business" value="${esc(state.meta.business)}" placeholder="Business name"></label>
    <label class="field"><span>Your name, optional</span>
      <input type="text" id="f-respondent" value="${esc(state.meta.respondent)}" placeholder="Your name"></label>
    <label class="field"><span>Your role</span>
      <select id="f-role">
        <option value="leadership">Founder or leadership team</option>
        <option value="team">Team, manager or specialist</option>
      </select></label>
    <label class="field"><span>Size of business</span>
      <select id="f-preset">
        ${Object.entries(WEIGHTS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("")}
      </select></label>
    <p class="small muted">Size sets how the six areas are weighted. Founder dependency matters far more in an eight-person business than in a two-hundred-person one.</p>
    <div class="nav"><button class="btn" id="go">Start</button></div>`;
}

function screenDomain(step){
  const d = DOMAINS[step-1];
  setNote(`Area ${step} of 6`);
  const qs = Q[d.id].map((t,i)=>{
    const key = d.id+"-"+i;
    const a = state.answers[key];
    const opts = SCALE.map((o,oi)=>{
      const checked = a && a.oi===oi ? "checked" : "";
      return `<label class="opt ${o.na?"na":""}">
        <input type="radio" name="${key}" value="${oi}" ${checked}>
        <span>${o.t}</span></label>`;
    }).join("");
    const num = DOMAINS.slice(0,step-1).reduce((t,dd)=>t+Q[dd.id].length,0) + i + 1;
    return `<div class="q">
      <div class="qtext"><div class="qnum">${num}</div><div class="qbody">${t}</div></div>
      <div class="scale">${opts}</div>
    </div>`;
  }).join("");
  return `
    <h2>${d.name}</h2>
    <p class="muted">${d.blurb}</p>
    <hr class="divider">
    ${qs}
    <div class="nav">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn" id="go">Continue</button>
      <span class="warn hide" id="warn"></span>
    </div>`;
}

function screenText(){
  setNote("Four open questions");
  return `
    <h2>Four open questions</h2>
    <p class="muted">Optional, but the result is materially more useful when they are answered.</p>
    ${FREETEXT.map((q,i)=>`<label class="field" style="max-width:100%"><span>${i+1}</span>
      <p style="margin:0 0 8px">${q}</p>
      <textarea id="t-${i}">${esc(state.text[i])}</textarea></label>`).join("")}
    <div class="nav">
      <button class="btn ghost" id="back">Back</button>
      <button class="btn" id="go">See the result</button>
    </div>`;
}

function screenResults(){
  setNote("Result");
  const r = compute();
  const dNames = Object.fromEntries(DOMAINS.map(d=>[d.id,d]));

  const bars = r.rows.map(row=>{
    if(row.insufficient){
      return `<div class="bar nodata">
        <div class="top"><span class="name">${row.name}</span><span class="val">Insufficient data</span></div>
        <div class="track"></div></div>`;
    }
    return `<div class="bar">
      <div class="top"><span class="name">${row.name}</span><span class="val">${row.score}</span></div>
      <div class="track"><div class="fill" style="width:${row.score}%"></div></div></div>`;
  }).join("");

  const maxDef = r.ranked.length ? r.ranked[0].deficit : 1;
  const rank = r.ranked.map((row,i)=>`
    <div class="row ${i===0?"primary":""}">
      <div class="pos">${i+1}</div>
      <div>
        <div class="nm">${row.name}${row.joint?" (joint)":""}</div>
        <div class="sub">Score ${row.score} · weight ${Math.round(row.weight)} · usually points to ${dNames[row.id].points}</div>
      </div>
      <div class="def">
        <div class="defnum">${row.deficit}</div>
        <div class="defbar"><i style="width:${maxDef?Math.round(row.deficit/maxDef*100):0}%"></i></div>
      </div>
    </div>`).join("");

  const primary = r.ranked[0];
  const answered = Object.values(state.answers).filter(a=>!a.na).length;

  const texts = FREETEXT.map((q,i)=> state.text[i].trim()
    ? `<dt>${q}</dt><dd>${esc(state.text[i])}</dd>` : "").join("");

  return `
    <h1>${esc(state.meta.business || "Your business")}</h1>
    <p class="muted small">${state.meta.respondent ? esc(state.meta.respondent)+" · " : ""}${state.meta.role==="leadership"?"Leadership":"Team"} · ${r.weightsLabel} · ${answered} of 42 statements scored</p>

    <div class="headline">
      <div class="score">${r.overall===null?"—":r.overall}</div>
      <div class="band">${r.band?r.band.name:"Not enough data"}</div>
      <p>${r.band?r.band.line:"Too many statements were marked not applicable to produce a score."}</p>
    </div>

    <h3>The six areas</h3>
    <div class="bars">${bars}</div>

    <hr class="divider">

    <h3>Constraint ranking</h3>
    <p class="small muted">Ranked by weighted deficit, not by lowest score. An area scoring 40 at a weight of 25 is holding the business back more than one scoring 30 at a weight of 5. This order is the recommended sequence of work.</p>
    <div class="rank">${rank}</div>

    ${primary ? `<div class="callout" style="margin-top:26px">
      <h3>The primary constraint is ${primary.name.toLowerCase()}</h3>
      <p>It scored ${primary.score} out of 100, and at this size of business it carries a weight of ${Math.round(primary.weight)}, which is why it ranks first. Work here before anything else: improving the other areas will not move the business while this one holds.</p>
    </div>` : ""}

    ${texts ? `<hr class="divider"><h3>What you told us</h3><dl class="ft">${texts}</dl>` : ""}

    <div class="nav noprint">
      <button class="btn" id="print">Print or save as PDF</button>
      <button class="btn ghost" id="export">Download the data</button>
      <button class="btn ghost" id="restart">Start again</button>
    </div>`;
}

/* ---------------- flow ---------------- */

function render(){
  const el = $("screen");
  if(state.step===0) el.innerHTML = screenSetup();
  else if(state.step<=6) el.innerHTML = screenDomain(state.step);
  else if(state.step===7) el.innerHTML = screenText();
  else el.innerHTML = screenResults();
  renderProgress();
  bind();
  window.scrollTo({top:0,behavior:"instant"});
}

function bind(){
  const go = $("go"), back = $("back");

  if(state.step===0 && go){
    go.onclick = ()=>{
      state.meta.business = $("f-business").value.trim();
      state.meta.respondent = $("f-respondent").value.trim();
      state.meta.role = $("f-role").value;
      state.meta.preset = $("f-preset").value;
      state.step = 1; render();
    };
    $("f-role").value = state.meta.role;
    $("f-preset").value = state.meta.preset;
  }

  if(state.step>=1 && state.step<=6){
    const d = DOMAINS[state.step-1];
    document.querySelectorAll('input[type=radio]').forEach(inp=>{
      inp.onchange = ()=>{
        const oi = +inp.value, o = SCALE[oi];
        state.answers[inp.name] = { oi, v:o.v, na:!!o.na, dk:!!o.dk };
        const w = $("warn"); if(w) w.classList.add("hide");
      };
    });
    go.onclick = ()=>{
      const missing = Q[d.id].some((_,i)=>!state.answers[d.id+"-"+i]);
      if(missing){
        const w = $("warn");
        w.textContent = "Answer every statement before continuing.";
        w.classList.remove("hide");
        return;
      }
      state.step++; render();
    };
    back.onclick = ()=>{ state.step--; render(); };
  }

  if(state.step===7){
    go.onclick = ()=>{
      state.text = FREETEXT.map((_,i)=>$("t-"+i).value);
      state.step = 8; render();
    };
    back.onclick = ()=>{
      state.text = FREETEXT.map((_,i)=>$("t-"+i).value);
      state.step--; render();
    };
  }

  if(state.step===8){
    $("print").onclick = ()=>window.print();
    $("restart").onclick = ()=>{
      state.step=0; state.answers={}; state.text=["","","",""]; render();
    };
    $("export").onclick = ()=>{
      const r = compute();
      const payload = {
        instrument:"Pivot Prime Operational Constraint Diagnostic",
        version:"1.0",
        completedAt:new Date().toISOString(),
        meta:state.meta,
        weightsLabel:r.weightsLabel,
        overall:r.overall,
        band:r.band?r.band.name:null,
        domains:r.rows,
        constraintRanking:r.ranked.map(x=>({domain:x.name,score:x.score,weight:Math.round(x.weight),weightedDeficit:x.deficit})),
        answers:Object.fromEntries(Object.entries(state.answers).map(([k,v])=>[k,{value:v.na?"n/a":v.v,anchor:ANCHORS.has(k)}])),
        freeText:Object.fromEntries(FREETEXT.map((q,i)=>[q,state.text[i]]))
      };
      const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (state.meta.business||"diagnostic").toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-constraint-diagnostic.json";
      a.click();
      URL.revokeObjectURL(a.href);
    };
  }
}

render();
</script>
</body>
</html>
